[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "website-chatbot-benchmark"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18.6,<0.20"]

[project.scripts]
benchmark = "website_chatbot_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["website_chatbot_benchmark*"]

[tool.setuptools.data-files]
"share/website-chatbot-benchmark" = ["benchmark.example.yaml"]
